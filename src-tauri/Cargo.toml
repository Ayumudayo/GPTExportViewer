[package]
name = "gpt-export-manager"
version = "0.1.0"
description = "Portable ChatGPT export viewer"
authors = ["GPTExportManager"]
edition = "2021"

[lib]
name = "gpt_export_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "GPTExportManager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.1"
thiserror = "2"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
